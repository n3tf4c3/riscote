<h1>Itens e tubo de tinta</h1>
<p>Potes de vidro com líquido chapado, rolha e rótulo branco com símbolo marinho (a cor não é a única pista). Surgem sobre plataformas; somem em 10 s. O tubo azul só aparece no modo difícil. Fonte: <code>items.ts</code> e <code>arena.ts</code>.</p>
