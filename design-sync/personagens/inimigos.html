<h1>Inimigos — formas baixas, em outros tons de tinta</h1>
<p>Jogadores são figuras altas de nanquim preto; inimigos são compridos ou redondos, em sépia, índigo ou no preto profundo do borrão. Caixa no jogo: traça e saltador 18 × 18 px; borrão 26 × 26 px.</p>
<div class="row three">
<figure><svg viewBox="0 0 200 160" style="height:150px" role="img" aria-label="Traça"><use href="#chao"/><use href="#traca"/></svg><figcaption><b>Traça</b><code>sépia #5b4532 · cabeça #3a2c20</code> · patrulha, pula e desce</figcaption></figure>
<figure><svg viewBox="0 0 200 160" style="height:150px" role="img" aria-label="Saltador"><use href="#chao"/><use href="#traco" transform="translate(92 112) rotate(20) scale(1.1 0.22)" fill="#3a3570" filter="url(#seco)"/><use href="#traco" transform="translate(112 112) rotate(-20) scale(1.1 0.22)" fill="#3a3570" filter="url(#seco)"/><path d="M104 52 Q132 54 134 84 Q136 112 104 116 Q72 116 72 88 Q72 66 88 58 Q92 46 104 52 Z" fill="#3a3570" filter="url(#tinta)"/><ellipse cx="112" cy="80" rx="7" ry="8" fill="#efe8d8"/><circle cx="114" cy="81" r="3.4" fill="#141414"/><ellipse cx="96" cy="81" rx="5" ry="6.5" fill="#efe8d8"/><circle cx="98" cy="82" r="2.8" fill="#141414"/></svg><figcaption><b>Saltador</b><code>índigo #3a3570</code> · quica rumo ao jogador mais próximo</figcaption></figure>

<h2>Ciclo da tinta</h2>
<div class="row five">
