<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Papel e tinta</title>
<style>
  body { margin: 0; padding: 22px; color: #1f2433; font: 14px/1.45 "Nunito", "Arial Rounded MT Bold", "Segoe UI", system-ui, sans-serif;
    background: #f6f1e7 repeating-linear-gradient(to bottom, transparent 0 27px, #e3dbca 27px 28px); }
  h1 { display: inline-block; margin: 0 0 10px; padding: 6px 16px; border-radius: 12px; background: #1f2433; color: #ffc234;
    font-size: 20px; font-weight: 900; box-shadow: 4px 5px 0 rgba(31,36,51,.25); }
  h2 { display: inline-block; margin: 16px 0 8px; padding: 3px 12px; border: 2.5px solid #1f2433; border-radius: 10px; background: #fff;
    font-size: 13px; font-weight: 900; box-shadow: 3px 4px 0 rgba(31,36,51,.2); }
  p, li { color: #3c4256; } p { margin: 0 0 10px; max-width: 70em; } ul { margin: 0 0 10px; padding-left: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  figure { margin: 0; background: #fff; border: 2.5px solid #1f2433; border-radius: 14px; box-shadow: 4px 5px 0 rgba(31,36,51,.22);
    padding: 8px 10px 6px; text-align: center; }
  figure > svg { display: block; margin: 0 auto; } .grid > svg { display: inline-block !important; margin: 0 !important; }
  figcaption { font-size: 12px; color: #3c4256; margin-top: 4px; } figcaption b { display: block; color: #1f2433; font-size: 13px; }
  code { font: 12px ui-monospace, monospace; }
  .chip { width: 120px; } .chip i { display: block; height: 52px; border-radius: 9px; border: 2.5px solid #1f2433; margin-bottom: 4px; }
  .hand { font-family: "Segoe Print", "Comic Sans MS", cursive; color: #15a08c; }
</style>
</head>
<body>

<h1>Papel, traço e paleta de apoio</h1>
<p>O jogável tem contorno marinho e cor chapada; o decorativo é claro e sem contorno. Valores em <code>apps/client/src/art/svg.ts</code> (<code>INK</code>, <code>PAPER</code>, <code>PAPER_LINE</code>, <code>PALETTE</code>).</p>
<div class="grid">
<figure class="chip"><i style="background:#1f2433"></i><figcaption><b>Traço marinho</b><code>#1f2433</code><br>contornos, olhos, sólidos, texto</figcaption></figure>
<figure class="chip"><i style="background:#f6f1e7"></i><figcaption><b>Papel</b><code>#f6f1e7</code><br>página da arena e da capa</figcaption></figure>
<figure class="chip"><i style="background:#e3dbca"></i><figcaption><b>Pauta</b><code>#e3dbca</code><br>linhas do caderno</figcaption></figure>
<figure class="chip"><i style="background:#ffffff"></i><figcaption><b>Branco</b><code>#ffffff</code><br>cartões, olhos, tênis, brilhos</figcaption></figure>
<figure class="chip"><i style="background:#2f6fd6"></i><figcaption><b>Tinta azul</b><code>#2f6fd6</code><br>só encharcado, bola, gota, tubos</figcaption></figure>
<figure class="chip"><i style="background:#ff6b3d"></i><figcaption><b>Laranja</b><code>#ff6b3d</code><br>destaque, alerta quente</figcaption></figure>
<figure class="chip"><i style="background:#ffc234"></i><figcaption><b>Amarelo</b><code>#ffc234</code><br>texto em chip escuro, estrelas, invencível</figcaption></figure>
<figure class="chip"><i style="background:#15a08c"></i><figcaption><b>Verde-água</b><code>#15a08c</code><br>confirmação, legenda manuscrita</figcaption></figure>
<figure class="chip"><i style="background:#ffd2c2"></i><figcaption><b>Pêssego</b><code>#ffd2c2</code><br>halo atrás de destaques</figcaption></figure>
<figure class="chip"><i style="background:#ff8fa3"></i><figcaption><b>Rosa</b><code>#ff8fa3</code><br>bochechas</figcaption></figure>
<figure class="chip"><i style="background:#c8344a"></i><figcaption><b>Boca</b><code>#c8344a</code><br>miolo das bocas abertas</figcaption></figure>
<figure class="chip"><i style="background:#8a90a0"></i><figcaption><b>Cinza</b><code>#8a90a0</code><br>calças, texto secundário</figcaption></figure>
</div>

</body>
</html>
